<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>WAN</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>WAN Video Generation</h1>
        <hr>
        <p>You can generate videos by entering a prompt below.</p>
        <p id="status">Ready</p>
        <textarea class="promptInput" id="prompt" placeholder="Enter your prompt..." rows="1"></textarea><br><br>
        <button id="generateButton">Generate</button>
        <br>
        <div class="mainbox">
            <div class="leftbox">
                <div class="innerbox">
                    <label for="resolution">Resolution: </label>
                    <select id="resolution">
                        <option value="512x288">512 × 288 — Quick test</option>
                        <option value="640x384" selected>640 × 384 — Default</option>
                        <option value="832x480">832 × 480</option>
                        <option value="1024x576">1024 × 576</option>
                        <option value="1280x704">1280 × 704 — Higher resolution</option>
                    </select>
                </div>
                <div class="innerbox">
                    <label for="seed">Seed:</label>
                    <select id="seed">
                    <option value="42" selected>42 — Default</option>
                    <option value="123">123</option>
                    <option value="456">456</option>
                    <option value="789">789</option>
                    <option value="1234">1234</option>
                    </select>
                </div>
            </div>
            <div class="rightbox">
                <div class="innerbox">
                    <label for="steps">Steps:</label>
                    <select id="steps">
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                    <option value="50" selected>50 — Default</option>
                    <option value="60">60</option>
                    </select>
                </div>
                <div class="innerbox">
                    <label for="fps">FPS:</label>
                    <select id="fps">
                    <option value="12">12</option>
                    <option value="16">16</option>
                    <option value="24" selected>24 — Default</option>
                    <option value="30">30</option>
                    </select>
                </div>
            </div>
        </div>
        <video id="resultVideo" src="" style="width: 1024px; height: auto;"></video>
    </body>
</html>
