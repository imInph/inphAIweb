<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Chat</title>
        <link rel="stylesheet" href="/static/style.css">
        <script src="/static/markdown.js" defer></script>
        <script src="/static/script.js" defer></script>
    </head>
    <body>
        <aside class="sidebar" id="sidebar">
            <button id="newChat" type="button">New chat</button>
            <ul class="chatList" id="chatList"></ul>
        </aside>
        <div class="backdrop" id="backdrop" hidden></div>
        <main class="main">
            <header class="topbar">
                <button class="menuButton" id="menuButton" type="button" aria-label="Show chats">☰</button>
                <h1>Chat</h1>
                <select id="model" aria-label="Model"></select>
                <button class="plainButton" id="refreshModels" type="button" title="Reload the model list">↻</button>
                <button class="plainButton" id="settingsButton" type="button" aria-expanded="false">Settings</button>
            </header>
            <div class="settings" id="settings" hidden>
                <div class="innerbox">
                    <label for="systemPrompt">System prompt:</label>
                    <textarea id="systemPrompt" rows="3" placeholder="Optional, for this chat only"></textarea>
                </div>
                <div class="innerbox">
                    <label for="temperature">Temperature:</label>
                    <select id="temperature">
                        <option value="">Model default</option>
                        <option value="0">0 — Precise</option>
                        <option value="0.3">0.3</option>
                        <option value="0.7">0.7</option>
                        <option value="1">1</option>
                        <option value="1.3">1.3 — Creative</option>
                    </select>
                </div>
            </div>
            <p id="status" role="status" aria-live="polite"></p>
            <div class="messages" id="messages"></div>
            <form class="composer" id="composer">
                <textarea class="promptInput" id="prompt" aria-label="Message" placeholder="Send a message..." rows="1"></textarea>
                <button id="sendButton" type="submit">Send</button>
            </form>
        </main>
    </body>
</html>
